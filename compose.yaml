services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-challenge_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-challenge_platform}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only, for local Prisma commands. Never expose the database on a
    # public interface.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Only the hostname changes: the rest of the URL comes from .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-challenge_platform}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-challenge_platform}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-challenge_platform}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-challenge_platform}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET}
      CHALLENGE_SERVER_SECRET: ${CHALLENGE_SERVER_SECRET:?CHALLENGE_SERVER_SECRET}
      ADMIN_NAME: ${ADMIN_NAME:-Platform Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      NODE_ENV: production
    ports:
      # Behind the tls profile you can set APP_BIND=127.0.0.1 so only Caddy
      # is reachable from outside.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"

  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
